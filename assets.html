<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinamen Assets</title>
  <style>
    :root {
      --bg: #07080d; --panel: #11141b; --line: rgb(255 255 255 / 0.08); --text: #f2f4f8; --muted: #9aa1ae;
      --accent: #8be3d2; --amber: #f3c98b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    .app { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
    nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; }
    nav h1 { font-size: 15px; margin: 0 4px 12px; }
    nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 4px 6px; font-weight: 600; }
    nav button { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: none;
      border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; }
    nav button:hover { background: rgb(255 255 255 / 0.06); }
    nav button.on { background: rgb(139 227 210 / 0.14); color: var(--accent); }
    main { position: relative; overflow: hidden; }
    canvas { display: block; }
    .info { position: absolute; left: 16px; top: 16px; max-width: min(460px, calc(100% - 32px)); background: rgb(17 20 27 / 0.82);
      border-radius: 12px; padding: 12px 14px; }
    .info b { font-size: 14px; }
    .info p { margin: 4px 0 0; color: #c9ced8; }
    .controls { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: center;
      background: rgb(17 20 27 / 0.82); border-radius: 12px; padding: 10px 12px; }
    .controls button { font: inherit; color: var(--text); background: rgb(255 255 255 / 0.08); border: 0; border-radius: 8px; padding: 5px 12px; cursor: pointer; min-width: 64px; }
    .controls input { flex: 1; accent-color: var(--accent); }
    .controls output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    #icons { position: absolute; inset: 0; overflow-y: auto; padding: 24px; display: none; }
    #icons table { border-collapse: collapse; }
    #icons th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 0 14px 10px; }
    #icons td { padding: 7px 14px; border-top: 1px solid var(--line); text-align: center; }
    #icons td:first-child { text-align: left; color: #d6dae2; }
    .acc-icon.possible { color: var(--accent); }
    .acc-icon.notyet { color: var(--muted); opacity: .5; }
    .acc-icon.happened { color: var(--text); }
    .acc-icon.missed { color: #6b7280; }
    .legend { color: var(--muted); margin: 0 0 16px; max-width: 640px; }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      nav { max-height: 34vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav id="nav"><h1>Clinamen assets</h1></nav>
    <main id="main">
      <div class="info"><b id="title"></b><p id="caption"></p></div>
      <div class="controls" id="controls">
        <button id="play">Pause</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Progress" />
        <output id="pct">0%</output>
      </div>
      <div id="icons"></div>
    </main>
  </div>
  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
