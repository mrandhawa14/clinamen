<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terrarium</title>
  <style>
    :root { --panel: rgb(12 14 20 / 0.74); --text: #f2f4f8; --muted: #a3a9b6; --accent: #8be3d2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); background: var(--panel);
      border-radius: 14px; padding: 12px 14px; transition: opacity .4s; }
    #where { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    button { font: inherit; color: var(--text); background: rgb(255 255 255 / 0.09); border: 0; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
    button:hover { background: rgb(255 255 255 / 0.15); }
    button.on { background: var(--accent); color: #0b2a26; font-weight: 600; }
    .foot { margin-top: 8px; color: var(--muted); font-size: 12px; }
    body.clean .hud, body.wallpaper .hud { opacity: 0; pointer-events: none; }
    body.wallpaper:hover .hud { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="hud">
    <div id="where">…</div>
    <div class="row">
      <button id="space">Back to space</button>
      <button id="director" title="Let the camera wander to interesting places">Director</button>
      <button id="pin" title="Copy a link that shows this exact view as a wallpaper">Pin as wallpaper</button>
      <button id="newworld">New world</button>
    </div>
    <div class="foot">World: <b id="seed"></b> · drag to move · scroll to zoom · right-drag to turn · click to fly there · H hides this</div>
  </div>
  <script type="module" src="/src/planet/app.js"></script>
</body>
</html>
